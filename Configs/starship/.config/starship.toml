format = """
$directory\
$python\
$c\
$cpp\
$time\
"""
palette = 'colors'
[palettes.colors]
color1 = '#81d3e0'
color2 = '#00363c'
color3 = '#bfc8ca'
color4 = '#1b2122'
color5 = '#00363c'
color6 = '#0e1415'
color7 = '#0e1415'
color8 = '#81d3e0'
color9 = '#bac6ea'
[c]
symbol = " "
style = "light-blue"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "light-blue"
format = '[ $symbol ($version) ]($style)'

[battery]
format = "[ $percentage $symbol]($style)"
full_symbol = "█"
charging_symbol = "[↑](italic bold green)"
discharging_symbol = "↓"
unknown_symbol = "░"
empty_symbol = "▃"
[[battery.display]]
threshold = 20
style = "italic bold red"

[[battery.display]]
threshold = 60
style = "italic dimmed bright-purple"

[[battery.display]]
threshold = 70
style = "italic dimmed yellow"
[python]
symbol = "[](bold bright-blue)"

