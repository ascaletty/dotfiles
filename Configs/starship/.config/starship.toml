format = """
$directory\
$python\
$c\
$cpp\
$time\
"""
palette = 'colors'
[palettes.colors]
color1 = '#bece7f'
color2 = '#2a3400'
color3 = '#c7c8b8'
color4 = '#1f2019'
color5 = '#2a3400'
color6 = '#13140d'
color7 = '#13140d'
color8 = '#bece7f'
color9 = '#a1d0c4'
[c]
symbol = " "
style = "light-blue"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "light-blue"
format = '[ $symbol ($version) ]($style)'

[battery]
format = "[ $percentage $symbol]($style)"
full_symbol = "█"
charging_symbol = "[↑](italic bold green)"
discharging_symbol = "↓"
unknown_symbol = "░"
empty_symbol = "▃"
[[battery.display]]
threshold = 20
style = "italic bold red"

[[battery.display]]
threshold = 60
style = "italic dimmed bright-purple"

[[battery.display]]
threshold = 70
style = "italic dimmed yellow"
[python]
symbol = "[](bold bright-blue)"

