format = """
$directory\
$python\
$c\
$cpp\
$time\
"""
[c]
symbol = " "
style = "light-blue"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "light-blue"
format = '[ $symbol ($version) ]($style)'

[battery]
format = "[ $percentage $symbol]($style)"
full_symbol = "█"
charging_symbol = "[↑](italic bold green)"
discharging_symbol = "↓"
unknown_symbol = "░"
empty_symbol = "▃"
[[battery.display]]
threshold = 20
style = "italic bold red"

[[battery.display]]
threshold = 60
style = "italic dimmed bright-purple"

[[battery.display]]
threshold = 70
style = "italic dimmed yellow"
[python]
symbol = "[](bold bright-blue)"

